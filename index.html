<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>13 Beads</title>
  <meta name="description" content="String a friendship bracelet in your browser. Pick your beads, spell your phrase, and hang it on your wall.">
  <meta property="og:title" content="13 Beads">
  <meta property="og:description" content="String a friendship bracelet in your browser.">
  <meta name="theme-color" content="#130e21">
  <script>try{var t=localStorage.getItem("13beads.theme");document.documentElement.dataset.theme=t==="dark"||t==="light"?t:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%237f7398' stroke-width='1.8'/%3E%3Crect x='22.27' y='9.21' width='7.2' height='6.4' rx='2.4' fill='%23ff5fae' stroke='%233a2d55' stroke-width='.9' transform='rotate(70.0 25.87 12.41)'/%3E%3Crect x='22.46' y='15.81' width='7.2' height='6.4' rx='2.4' fill='%233fd3c6' stroke='%233a2d55' stroke-width='.9' transform='rotate(106.7 26.06 19.01)'/%3E%3Crect x='18.67' y='21.22' width='7.2' height='6.4' rx='2.4' fill='%23ffd23f' stroke='%233a2d55' stroke-width='.9' transform='rotate(143.3 22.27 24.42)'/%3E%3Crect x='12.40' y='23.30' width='7.2' height='6.4' rx='2.4' fill='%23a77bff' stroke='%233a2d55' stroke-width='.9' transform='rotate(180.0 16.00 26.50)'/%3E%3Crect x='6.13' y='21.22' width='7.2' height='6.4' rx='2.4' fill='%23ffffff' stroke='%233a2d55' stroke-width='.9' transform='rotate(216.7 9.73 24.42)'/%3E%3Crect x='2.34' y='15.81' width='7.2' height='6.4' rx='2.4' fill='%235aa9ff' stroke='%233a2d55' stroke-width='.9' transform='rotate(253.3 5.94 19.01)'/%3E%3Crect x='2.53' y='9.21' width='7.2' height='6.4' rx='2.4' fill='%23ff8a3d' stroke='%233a2d55' stroke-width='.9' transform='rotate(290.0 6.13 12.41)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Pacifico&display=swap">
</head>
<body>
  <div class="app">
    <header>
      <a class="back" href="https://games.shauna.digital" title="All games">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Games</span>
      </a>
      <h1 class="mark" aria-label="13 Beads">
        <span>1</span><span>3</span><span class="dot"></span><span>B</span><span>E</span><span>A</span><span>D</span><span>S</span>
      </h1>
      <div class="head-right">
        <button class="hbtn" id="tilt" type="button" aria-label="Turn on tilt" title="Tilt" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="7.5" y="3.5" width="9" height="17" rx="2.2" transform="rotate(-14 12 12)" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 9.5a9 9 0 0 0 0 5M20.5 9.5a9 9 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <button class="hbtn" id="themeBtn" type="button" aria-label="Switch to dark mode" title="Dark mode">
          <svg class="moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M19.5 14.6A7.6 7.6 0 0 1 9.4 4.5a7.6 7.6 0 1 0 10.1 10.1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          <svg class="sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="3.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <button class="hbtn" id="sound" type="button" aria-label="Sound" aria-pressed="true" title="Sound">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path class="slash" d="M15.5 9.5l5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <button class="hbtn" id="stackBtn" type="button" aria-label="Your wall" aria-pressed="false" title="Your wall">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 5h16M12 5v15M8.5 20h7M7 5v1.5M17 5v1.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="7" cy="10" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="10" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          <span class="badge" id="wallCount" hidden></span>
        </button>
      </div>
    </header>

    <div class="stage" id="stage"><canvas id="cv" aria-label="Your bracelet string"></canvas><span class="count" id="count" aria-label="Beads on the string">0 / 26</span>
      <div class="hud" id="hud" data-mode="line">
        <button class="icon-btn solo" id="untie" type="button" data-show="tied" aria-label="Back to stringing" title="Back to stringing">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6 4 11l5 5M4.5 11H14a5.5 5.5 0 0 1 0 11h-1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="corner">
          <button class="icon-btn" id="customBtn" type="button" data-show="stack" aria-label="Decorate the wall" title="Decorate the wall" aria-haspopup="dialog" aria-expanded="false" aria-controls="custom">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="4" y="3.5" width="14" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M18 6.5h1.5a1 1 0 0 1 1 1V11a1 1 0 0 1-1 1H12v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><rect x="10" y="15" width="4" height="6" rx="1.2" fill="currentColor"/></svg>
          </button>
          <button class="icon-btn" id="restart" type="button" data-show="line" aria-label="Start over with the starter bracelet" title="Start over">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v3.2h3.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 9.2l.8 1.8 1.8.8-1.8.8-.8 1.8-.8-1.8-1.8-.8 1.8-.8z" fill="currentColor"/></svg>
          </button>
          <button class="icon-btn" id="undo" type="button" data-show="line" aria-label="Undo" title="Undo">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8.5 5.5 4 10l4.5 4.5M4.5 10H14a5.5 5.5 0 0 1 0 11h-2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="clear" type="button" data-show="line" aria-label="Clear the string" title="Clear the string">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.9 12.2a1.5 1.5 0 0 0 1.5 1.3h6.2a1.5 1.5 0 0 0 1.5-1.3L17.5 7M10.3 11v5.5M13.7 11v5.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="photoBtn" type="button" data-show="tied stack" aria-label="Save photo" title="Save photo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.3-2h5.2l1.3 2h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12.4" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
        </div>
        <div class="ring-btns" id="ringBtns" data-show="stack" role="group" aria-label="Bracelets on the wall"></div>
        <div class="side" data-show="line" role="group" aria-label="Which end new beads go on">
          <button class="seg" type="button" data-side="L" aria-pressed="false" aria-label="Add to the left end" title="Add to the left end">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4.5 5v14M19 12H8.5M12.5 7.5 8 12l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="seg" type="button" data-side="R" aria-pressed="true" aria-label="Add to the right end" title="Add to the right end">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M19.5 5v14M5 12h10.5M11.5 7.5 16 12l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <p class="note" id="note" aria-live="polite"></p>
        <button class="fab" id="tie" type="button" data-show="line">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 12c-3-4.5-8-4-8-.5S9 16 12 12Zm0 0c3-4.5 8-4 8-.5S15 16 12 12Zm0 0-3 7m3-7 3 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Finish bracelet
        </button>
        <button class="fab" id="another" type="button" data-show="stack"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg> Make another</button>
        <button class="fab" id="wear" type="button" data-show="tied"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg> Add to my wall</button>
        <div class="pop" id="pop" role="dialog" aria-modal="true" aria-labelledby="popTitle" hidden>
          <p class="pop-title" id="popTitle">Take this one off the wall?</p>
          <div class="pop-actions">
            <button class="btn" id="popKeep" type="button">Keep it</button>
            <button class="btn danger" id="takeOff" type="button">Take it off</button>
          </div>
        </div>
        <div class="pop custom" id="custom" role="dialog" aria-modal="true" aria-labelledby="customTitle" hidden>
          <p class="pop-title" id="customTitle">Decorate your wall</p>
          <fieldset class="swatches">
            <legend>Wall color</legend>
            <label class="swatch"><input type="radio" name="wallColor" value="white"><span style="--sw:#f3eee6"></span>White</label>
            <label class="swatch"><input type="radio" name="wallColor" value="pink"><span style="--sw:#f6cfe2"></span>Pink</label>
            <label class="swatch"><input type="radio" name="wallColor" value="sage"><span style="--sw:#cbdcc6"></span>Sage</label>
          </fieldset>
          <label class="sign-field" for="signText">Neon sign
            <input id="signText" type="text" maxlength="12" autocomplete="off" spellcheck="false" aria-describedby="signHelp">
          </label>
          <p class="sign-help" id="signHelp">Up to 12 letters, numbers, spaces, or ! ? &amp;</p>
          <button class="btn primary" id="customDone" type="button">Done</button>
        </div>
      </div>
    </div>
    <p class="status" id="status" hidden></p>

    <div class="panel" id="buildPanel">
      <form class="phrase" id="phraseForm">
        <input id="phrase" type="text" maxlength="26" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Type a phrase to spell it" aria-label="Phrase to spell in letter beads" enterkeyhint="done">
        <button class="phrase-go" type="submit" aria-label="String it" title="String it">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h13M13 6.5 18.5 12 13 17.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <div class="case" id="case">
        <button class="case-lid" id="caseToggle" type="button" aria-expanded="true" aria-controls="caseBody" aria-label="Hide the bead case">
          <span class="lid-label">Bead case</span>
          <svg class="lid-chev" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 9.5 12 15.5 18 9.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="case-body" id="caseBody">
          <div class="row">
            <div class="tabs" role="tablist">
              <button class="tab" type="button" role="tab" data-tab="colors" aria-selected="true">Beads</button>
              <button class="tab" type="button" role="tab" data-tab="letters" aria-selected="false">Letters</button>
              <button class="tab" type="button" role="tab" data-tab="charms" aria-selected="false">Charms</button>
              <button class="tab" type="button" role="tab" data-tab="dangles" aria-selected="false">Dangles</button>
            </div>
          </div>
          <div class="tray" id="tray"></div>
        </div>
      </div>
    </div>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
