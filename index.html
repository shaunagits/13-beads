<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>13 Beads</title>
  <meta name="description" content="String a friendship bracelet in your browser. Pick your beads, spell your phrase, tie it off.">
  <meta property="og:title" content="13 Beads">
  <meta property="og:description" content="String a friendship bracelet in your browser.">
  <meta name="theme-color" content="#130e21">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='0' y='15' width='32' height='2' fill='%237f7398'/%3E%3Crect x='8' y='6' width='16' height='20' rx='6' fill='%23d3217c'/%3E%3Crect x='11' y='8' width='10' height='4' rx='2' fill='%23fff' opacity='.7'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
</head>
<body>
  <div class="app">
    <header>
      <h1 class="mark" aria-label="13 Beads">
        <span>1</span><span>3</span><span class="dot"></span><span>B</span><span>E</span><span>A</span><span>D</span><span>S</span>
      </h1>
      <div class="head-right">
        <button class="ghost" id="tilt" type="button" hidden>Tilt</button>
        <button class="ghost" id="sound" type="button" aria-pressed="true">Sound</button>
        <button class="ghost" id="stackBtn" type="button">Jacket</button>
      </div>
    </header>

    <div class="stage" id="stage"><canvas id="cv" aria-label="Your bracelet string"></canvas><span class="count" id="count" aria-label="Beads on the string">0 / 26</span></div>
    <p class="status" id="status" aria-live="polite">Tap a bead to string it. On the string: tap to pull off, drag to reorder, or pluck and strum the string itself.</p>

    <div class="panel" id="buildPanel">
      <form class="phrase" id="phraseForm">
        <input id="phrase" type="text" maxlength="26" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Type a phrase" aria-label="Phrase to spell in letter beads">
        <button class="btn" type="submit">String it</button>
      </form>
      <div class="row">
        <div class="tabs" role="tablist">
          <button class="tab" type="button" role="tab" data-tab="colors" aria-selected="true">Beads</button>
          <button class="tab" type="button" role="tab" data-tab="letters" aria-selected="false">Letters</button>
          <button class="tab" type="button" role="tab" data-tab="charms" aria-selected="false">Charms</button>
          <button class="tab" type="button" role="tab" data-tab="dangles" aria-selected="false">Dangles</button>
        </div>
        <div class="side" role="group" aria-label="Which end of the string to add beads to">
          <span class="side-label">Add to</span>
          <button class="seg" type="button" data-side="L" aria-pressed="false">Left</button>
          <button class="seg" type="button" data-side="R" aria-pressed="true">Right</button>
        </div>
      </div>
      <div class="tray" id="tray"></div>
      <div class="actions">
        <button class="btn" id="undo" type="button">Undo</button>
        <button class="btn" id="clear" type="button">Clear</button>
        <button class="btn primary" id="tie" type="button">Tie it off</button>
      </div>
    </div>

    <div class="panel" id="tiedPanel" hidden>
      <p class="tied-title">Tied off. Pin it to your jacket?</p>
      <div class="actions">
        <button class="btn" id="untie" type="button">Untie</button>
        <button class="btn" id="tiedPhoto" type="button">Save photo</button>
        <button class="btn primary" id="wear" type="button">Pin it on</button>
      </div>
    </div>

    <div class="panel" id="stackPanel" hidden>
      <p class="tied-title" id="stackTitle">Your jacket</p>
      <div class="actions">
        <button class="btn" id="takeOff" type="button">Take one off</button>
        <button class="btn" id="stackPhoto" type="button">Save photo</button>
        <button class="btn primary" id="another" type="button">Make another</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
